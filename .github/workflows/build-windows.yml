name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # One installer that works on 64-bit, 32-bit and ARM Windows 10/11.
      - run: npm run dist:win
      # Launch the real packaged app (64-bit and 32-bit) and make sure it starts.
      - name: Smoke test installed app
        shell: pwsh
        run: |
          foreach ($dir in @('release/win-unpacked', 'release/win-ia32-unpacked')) {
            $exe = Join-Path $dir 'IDCraft Studio.exe'
            Write-Host "Testing $exe"
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "$exe did not finish" }
            if ($p.ExitCode -ne 0) { throw "$exe smoke test failed with exit code $($p.ExitCode)" }
            Write-Host "OK: $exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: IDCraft-Studio-Windows
          path: release/IDCraft-Studio-Setup.exe

      # On a version tag (e.g. v1.0.0), publish a GitHub Release so the
      # installer gets a permanent download link.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/IDCraft-Studio-Setup.exe \
            --repo "$RELEASE_REPO" \
            --title "IDCraft Studio ${GITHUB_REF_NAME}" \
            --notes "Download **IDCraft-Studio-Setup.exe** below, run it, and follow the installer. Works on Windows 10 and 11 (64-bit, 32-bit and ARM)."
