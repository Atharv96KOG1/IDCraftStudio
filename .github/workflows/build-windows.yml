name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # One installer that works on 64-bit, 32-bit and ARM Windows 10/11.
      - run: npm run dist:win
      # Launch the real packaged app (64-bit and 32-bit) and make sure it starts.
      - name: Smoke test installed app
        shell: pwsh
        run: |
          foreach ($dir in @('release/win-unpacked', 'release/win-ia32-unpacked')) {
            $exe = Join-Path $dir 'IDCraft Studio.exe'
            Write-Host "Testing $exe"
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "$exe did not finish" }
            if ($p.ExitCode -ne 0) { throw "$exe smoke test failed with exit code $($p.ExitCode)" }
            Write-Host "OK: $exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/IDCraft-Studio-Setup.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test app
        run: |
          APP=$(ls -d release/mac-arm64/*.app | head -1)
          "$APP/Contents/MacOS/IDCraft Studio" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg

  # On a version tag (e.g. v1.2.0), publish one GitHub Release with every installer.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          ls -la out
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "$RELEASE_REPO" \
            --title "IDCraft Studio ${GITHUB_REF_NAME}" \
            --notes "**Windows:** download **IDCraft-Studio-Setup.exe**, run it and follow the installer (Windows 10/11, 64-bit, 32-bit and ARM).

          **Mac:** download **IDCraft-Studio-Mac-arm64.dmg** (Apple Silicon M1–M4) or **IDCraft-Studio-Mac-x64.dmg** (Intel). Open it, drag the app to Applications, then right-click the app → Open the first time."
